name: cactus

services:
  cactus-init:
    environment:
      CACTUS_CA_ID: "11129.11.99.3"
      CACTUS_LOG_NUMBER: "1"

  # The mirror name must match data/sunlight.yaml's mirrorname and the mirror
  # id in cactus-config-docker.json.
  sunlight-init:
    environment:
      SUNLIGHT_WITNESS_NAME: "sunlight.mirror.test"
      SUNLIGHT_MIRROR_NAME: "oid/1.3.6.1.4.1.11129.11.99.4"

  # Upstream compose.yaml sets no restart policy, so an OOM kill took the CA
  # down until someone restarted it by hand.
  cactus:
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /etc/nginx/sites-enabled &&
        touch /etc/nginx/tai-stream-map.conf &&
        nginx -g 'daemon off;'
      "
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:9998:9998"
      - "127.0.0.1:9999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tai-stream-map.conf:/etc/nginx/tai-stream-map.conf
      - ./letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
      - ./certs:/etc/certs:ro
      - ./www:/var/www
      - ./sites-enabled:/etc/nginx/sites-enabled
    depends_on:
      - cactus
      - skylight

  certbot:
    image: certbot/certbot:latest
    entrypoint: >
      sh -c "
        trap exit TERM;
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 5d & wait \$$!;
        done
      "
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-webroot:
