name: cactus

services:
  cactus-init:
    environment:
      CACTUS_CA_ID: "11129.11.99.1"
      CACTUS_LOG_NUMBER: "1"

  sunlight-init:
    entrypoint:
      - /bin/sh
      - -c
      - "sh /docker/init-sunlight.sh && sed -i 's/44363.47.2.1/11129.11.99.2/g' /var/lib/sunlight/sunlight.yaml"
    environment:
      SUNLIGHT_WITNESS_NAME: "sunlight.mirror.test"
      SUNLIGHT_MIRROR_NAME: "oid/1.3.6.1.4.1.11129.11.99.2"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /etc/nginx/sites-enabled &&
        nginx -g 'daemon off;'
      "
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro
      - ./certs:/etc/certs:ro
      - ./www:/var/www
      - ./sites-enabled:/etc/nginx/sites-enabled
    depends_on:
      - cactus
      - skylight

  certbot:
    image: certbot/certbot:latest
    entrypoint: >
      sh -c "
        trap exit TERM;
        while true; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 5d & wait \$$!;
        done
      "
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  certbot-webroot:
