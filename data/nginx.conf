user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    upstream tai_backend {
        server host.docker.internal:8443;
    }

    upstream demo_tai_backend {
        server host.docker.internal:8444;
    }

    upstream https_backend {
        server 127.0.0.1:4443;
    }

    map $ssl_preread_server_name $tls_backend {
        # Populated by docker-deploy.sh when ENABLE_TAI=true:
        #   tai.demo.mtcs.dev tai_backend;
        #   demo.mtcs.dev demo_tai_backend;
        include /etc/nginx/tai-stream-map.conf;
        default https_backend;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_backend;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name ca1.test.mtcs.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            set $cactus_upstream "cactus:14080";
            proxy_pass http://$cactus_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name mirror1.test.mtcs.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /mirror/ {
            set $skylight_upstream "skylight:8081";
            proxy_pass http://$skylight_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root /var/www/mirror1;
            index index.html;
        }
    }

    # Plaintext HTTP backends for bssl server (-proxy 127.0.0.1:9999)
    server {
        listen 9999;
        server_name tai.demo.mtcs.dev;
        root /var/www/tai.demo.mtcs.dev;
        index index.html;
    }

    server {
        listen 9999;
        server_name demo.mtcs.dev;
        root /var/www/demo.mtcs.dev;
        index index.html;
    }

    # Plaintext HTTP backend for non-TAI connections (-tai-fallback-proxy 127.0.0.1:9998)
    server {
        listen 9998;
        server_name demo.mtcs.dev tai.demo.mtcs.dev;
        root /var/www/$host-no-tai;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    include /etc/nginx/sites-enabled/*.conf;
}
